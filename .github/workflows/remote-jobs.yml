name: Daily Remote Jobs Scan

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run remote jobs scan
        env:
          MAX_AGE_HOURS: ${{ github.event_name == 'workflow_dispatch' && '240' || '40' }}
        run: python remote_jobs.py

      - name: Create GitHub Issue with report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f remote_title.txt ]; then
            gh issue create \
              --title "$(cat remote_title.txt)" \
              --body-file remote_body.txt
          else
            echo "No new relevant jobs today, no issue created."
          fi
